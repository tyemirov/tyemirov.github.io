---
- name: Qualify the selected music volume through Gateway
  hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ application_manifest }}"
  vars:
    selected_project: "{{ mprlab_resources.resources | selectattr('id', 'equalto', 'music') | first }}"
    mprlab_compose_registry_resource:
      owner: "{{ mprlab_resources.owner }}"
      id: "{{ selected_project.id }}"
    mprlab_retained_volume: "{{ selected_project.volumes | first }}"
    mprlab_compose_target_host: fixture
    mprlab_compose_target_docker_cli: /usr/bin/docker
    selected_route: "{{ mprlab_resources.resources | selectattr('id', 'equalto', 'api-route') | first }}"
    selected_handler: "{{ selected_route.handlers | selectattr('upstream', 'equalto', 'tyemirov-site.music-http') | first }}"
    selected_capability: "{{ mprlab_resources.resources | selectattr('kind', 'equalto', 'runtime_capability') | first }}"
  tasks:
    - name: Require the preflighted test volume identity
      ansible.builtin.assert:
        quiet: true
        that:
          - mprlab_retained_volume.name == expected_volume
    - name: Reconcile the retained volume with the real Gateway task
      ansible.builtin.include_tasks: "{{ gateway_root }}/deploy/ansible/playbooks/tasks/reconcile-selected-retained-volume.yml"
    - name: Initialize the isolated service port list
      ansible.builtin.set_fact:
        mprlab_compose_service_ports: []
    - name: Render the private bind with the real Gateway task
      ansible.builtin.include_tasks: "{{ gateway_root }}/deploy/ansible/playbooks/tasks/add-selected-compose-port.yml"
      vars:
        mprlab_compose_target_address: 127.0.0.1
        mprlab_compose_port: "{{ selected_project.services[0].ports[0] }}"
    - name: Export the selected runtime contract for the test
      ansible.builtin.copy:
        dest: "{{ selected_contract }}"
        content: "{{ {'owner': mprlab_resources.owner, 'volume': mprlab_retained_volume.name, 'service': selected_project.services | first, 'route': selected_route, 'ports': mprlab_compose_service_ports} | to_json }}"
    - name: Require the selected media route and capability relationship
      ansible.builtin.assert:
        quiet: true
        that:
          - selected_handler.upstream == selected_capability.name
          - selected_capability.project == selected_project.id
          - selected_capability.service == selected_project.services[0].id
    - name: Initialize the isolated route candidate
      ansible.builtin.set_fact:
        mprlab_caddy_candidate_routes: []
    - name: Resolve selected handlers through the installed Gateway task
      ansible.builtin.include_tasks: "{{ gateway_root }}/deploy/ansible/playbooks/tasks/build-active-caddy-route.yml"
      vars:
        mprlab_caddy_candidate_route:
          owner: "{{ mprlab_resources.owner }}"
          id: "{{ selected_route.id }}"
          desired: "{{ selected_route }}"
        mprlab_declared_resource_state:
          capabilities:
            - name: "{{ selected_capability.name }}"
              endpoint:
                host: 127.0.0.1
                port: "{{ selected_capability.endpoint.port }}"
            - name: tyemirov-site.gallery-http
              endpoint:
                host: 127.0.0.1
                port: 18093
            - name: tauth.http
              endpoint:
                host: 127.0.0.1
                port: 18094
    - name: Render the selected route with the installed Gateway Caddy template
      ansible.builtin.template:
        src: "{{ gateway_root }}/deploy/ansible/templates/active-caddy-routes.caddy.j2"
        dest: "{{ selected_caddy_config }}"
      vars:
        mprlab_caddy_automatic_tls_issuer: internal
        mprlab_caddy_candidate_listeners: []
        mprlab_caddy_candidate_certificate_claims: []
