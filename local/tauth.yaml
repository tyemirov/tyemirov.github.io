server:
  listen_addr: ":8080"
  database_url: "sqlite:///data/tauth.db"
  enable_cors: true
  cors_allowed_origins:
    - "${STUDIO_WEBSITE_ORIGIN}"
  enable_tenant_header_override: true
tenants:
  - id: "tyemirov-gallery-development"
    display_name: "Local Gallery Studio"
    tenant_origins:
      - "${STUDIO_WEBSITE_ORIGIN}"
    google_web_client_id: "${GALLERY_GOOGLE_WEB_CLIENT_ID}"
    jwt_signing_key: "${GALLERY_TAUTH_SIGNING_KEY}"
    cookie_domain: ""
    session_cookie_name: "tyemirov_gallery_development_session"
    refresh_cookie_name: "tyemirov_gallery_development_refresh"
    session_ttl: "30m"
    refresh_ttl: "720h"
    nonce_ttl: "10m"
    allow_insecure_http: true
