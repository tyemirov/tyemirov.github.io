services:
  media-init:
    build:
      context: .
      dockerfile: Dockerfile.pages
      target: build
    command: ["node", "local/prepare.mjs", "/public", "/input-media", "/site", "/media"]
    volumes:
      - type: bind
        source: ${MUSIC_LOCAL_ROOT:?Start local services with make up}
        target: /input-media
        read_only: true
        bind:
          create_host_path: false
      - media:/media
      - type: bind
        source: ${LOCAL_SITE_ROOT:?Start local services with make up}
        target: /site
        bind:
          create_host_path: false

  music:
    build:
      context: ./services/music-stream
    command:
      - --listen=0.0.0.0:8092
      - --media-root=/media
      - --index=/media/selected.json
      - --allowlist=/media/allowlist.json
      - --public-origin=https://localhost:${MUSIC_PORT:-8444}
      - --allowed-origins=https://localhost:${UP_PORT:-8443}
    volumes:
      - media:/media:ro
    ports:
      - "127.0.0.1::8092"
    depends_on:
      media-init:
        condition: service_completed_successfully

volumes:
  media:
