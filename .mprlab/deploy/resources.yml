---
mprlab_resources:
  owner: tyemirov-site
  release:
    scheme: semver
  resources:
    - kind: private_values
      id: private
      bindings:
        trusted-proxies: MUSIC_TRUSTED_PROXIES
        gallery-tauth-signing-key: GALLERY_TAUTH_SIGNING_KEY
        gallery-google-web-client-id: GALLERY_GOOGLE_WEB_CLIENT_ID
    - kind: tauth_tenant
      id: gallery-auth
      capability: tauth.tenants
      version: 1
      tenant:
        id: tyemirov-gallery
        display_name: Gallery Studio
        origins:
          - https://tyemirov.net
        google_web_client_id:
          resource: private
          output: gallery-google-web-client-id
        jwt_signing_key:
          resource: private
          output: gallery-tauth-signing-key
        cookie:
          domain: api.tyemirov.net
          session_name: tyemirov_gallery_session
          refresh_name: tyemirov_gallery_refresh
    - kind: compose_project
      id: music
      images:
        - id: service
          repository: ghcr.io/tyemirov/personal-site-music
          build:
            context: services/music-stream
            dockerfile: services/music-stream/Dockerfile
            platforms:
              - linux/amd64
      volumes:
        - id: media
          name: tyemirov-site-music-media
          retention: retain
      services:
        - id: stream
          image: service
          placement:
            group: computercat
            cardinality: one
          command:
            - --listen
            - 0.0.0.0:8092
            - --media-root
            - /media
            - --index
            - /media/selected.json
            - --allowlist
            - /media/allowlist.json
            - --public-origin
            - https://api.tyemirov.net
            - --allowed-origins
            - https://tyemirov.net,https://www.tyemirov.net
          environment:
            MUSIC_TRUSTED_PROXIES:
              resource: private
              output: trusted-proxies
          mounts:
            - volume: media
              target: /media
              read_only: true
          ports:
            - container_port: 8092
              host_port: 8092
              scope: private_lan
          readiness:
            protocol: http
            port: 8092
            path: /music/readyz
            expected_status: 200
    - kind: runtime_capability
      id: music-http
      name: tyemirov-site.music-http
      version: 1
      project: music
      service: stream
      endpoint:
        scope: private_lan
        scheme: http
        port: 8092
      health:
        protocol: http
        path: /music/readyz
        expected_status: 200
    - kind: health_check
      id: music-public
      protocol: http
      url: https://api.tyemirov.net/music/readyz
      expected_status: 200
    - kind: github_pages
      id: website
      repository: tyemirov/tyemirov.github.io
      branch: gh-pages
      domain: tyemirov.net
      url: https://tyemirov.net/
      source:
        kind: container
        context: .
        dockerfile: Dockerfile.pages
      verification:
        path: /.mprlab-release.json
    - kind: compose_project
      id: gallery
      images:
        - id: service
          repository: ghcr.io/tyemirov/personal-site-gallery
          build:
            context: .
            dockerfile: services/gallery/Dockerfile
            platforms:
              - linux/amd64
      volumes:
        - id: data
          name: tyemirov-site-gallery-data
          retention: retain
      services:
        - id: api
          image: service
          placement:
            group: computercat
            cardinality: one
          command:
            - --listen=0.0.0.0:8093
            - --database=/data/gallery.db
            - --public-root=/site
            - --allowed-origin=https://tyemirov.net
            - --tenant-id=tyemirov-gallery
            - --owner-email=vadym@tyemirov.net
            - --cookie-name=tyemirov_gallery_session
            - --payments=disabled
            - --receipts=disabled
          environment:
            GALLERY_TAUTH_SIGNING_KEY:
              resource: private
              output: gallery-tauth-signing-key
          mounts:
            - volume: data
              target: /data
          ports:
            - container_port: 8093
              host_port: 8093
              scope: private_lan
          readiness:
            protocol: http
            port: 8093
            path: /gallery/readyz
            expected_status: 200
    - kind: runtime_capability
      id: gallery-http
      name: tyemirov-site.gallery-http
      version: 1
      project: gallery
      service: api
      endpoint:
        scope: private_lan
        scheme: http
        port: 8093
      health:
        protocol: http
        path: /gallery/readyz
        expected_status: 200
    - kind: health_check
      id: gallery-public
      protocol: http
      url: https://api.tyemirov.net/gallery/readyz
      expected_status: 200
    - kind: caddy_route
      id: api-route
      hostname: api.tyemirov.net
      listener: https
      handlers:
        - id: music
          path_prefix: /music
          upstream: tyemirov-site.music-http
        - id: gallery
          path_prefix: /gallery
          upstream: tyemirov-site.gallery-http
        - id: auth
          path_prefix: /auth
          upstream: tauth.http
      tls:
        mode: automatic
