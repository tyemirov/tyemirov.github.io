mprlab_resources:
    artifacts:
        container_images:
            - build:
                context: .
                dockerfile: services/gallery/Dockerfile
                platforms:
                    - linux/amd64
              id: gallery-service
            - build:
                context: .
                dockerfile: services/music-stream/Dockerfile
                platforms:
                    - linux/amd64
              id: music-service
        web_bundles:
            - format: directory
              id: website
              source:
                context: .
                dockerfile: Dockerfile.pages
                kind: container
    environment:
        private_inputs:
            - id: deploy-sudo-password-tutosh
              variable: DEPLOY_SUDO_PASSWORD_TUTOSH
            - id: gallery-google-web-client-id
              variable: GALLERY_GOOGLE_WEB_CLIENT_ID
            - id: gallery-tauth-signing-key
              variable: GALLERY_TAUTH_SIGNING_KEY
            - id: mprlab-tauth-management-url
              variable: MPRLAB_TAUTH_MANAGEMENT_URL
            - id: mprlab-tauth-provisioning-credentials
              variable: MPRLAB_TAUTH_PROVISIONING_CREDENTIALS
        source: .mprlab/deploy/.env
    lifecycle:
        ci:
            command:
                - make
                - ci
            enabled: true
        defaults:
            timeouts:
                completion: 30m
                readiness: 2m
                request: 15s
                shutdown: 5s
                startup: 30s
        observations:
            http:
                - expected_status: 200
                  id: gallery-public
                  protocol: http
                  url: https://api.tyemirov.net/gallery/readyz
                - expected_status: 200
                  id: music-public
                  protocol: http
                  url: https://api.tyemirov.net/music/readyz
        operations:
            - name: app-deploy
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
            - name: app-plan-deploy
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
            - name: app-plan-publish
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
            - name: app-plan-release
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
            - name: app-publish
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
            - name: app-release
              polling:
                attempt_limit: 4
                increment: 1s
                initial: 2s
                maximum: 10s
                multiplier: 2
            - name: app_deploy.pages.deployment_status_poll
              polling:
                attempt_limit: 120
                increment: 0s
                initial: 1s
                maximum: 10s
                multiplier: 2
        private_inputs:
            operations: []
    owner: tyemirov-site
    publications:
        ghcr:
            images:
                - artifact: gallery-service
                  id: gallery-service
                  repository: ghcr.io/tyemirov/personal-site-gallery
                - artifact: music-service
                  id: music-service
                  repository: ghcr.io/tyemirov/personal-site-music
        github_pages:
            sites:
                - artifact: website
                  branch: gh-pages
                  domain: tyemirov.net
                  id: website
                  marker:
                    path: /.mprlab-release.json
                  repository: tyemirov/tyemirov.github.io
    release:
        scheme: semver
    targets:
        access:
            hosts:
                - elevation_password:
                    input: deploy-sudo-password-tutosh
                  host: tutosh
        docker_compose:
            projects:
                - id: gallery
                  services:
                    - command:
                        - --listen=0.0.0.0:8093
                        - --database=/data/gallery.db
                        - --public-root=/site
                        - --allowed-origin=https://tyemirov.net
                        - --tenant-id=tyemirov-gallery
                        - --owner-email=vadym@tyemirov.net
                        - --cookie-name=tyemirov_gallery_session
                        - --payments=disabled
                        - --receipts=disabled
                      endpoints:
                        - endpoint:
                            port: 8093
                            scheme: http
                            scope: private_lan
                          health:
                            expected_status: 200
                            path: /gallery/readyz
                            protocol: http
                          id: gallery-http
                          name: tyemirov-site.gallery-http
                          version: 1
                        - endpoint:
                            alias: gallery-api-readiness
                            port: 8093
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /gallery/readyz
                            protocol: http
                          id: readiness
                          name: tyemirov-site.readiness.gallery.api
                          version: 1
                      environment:
                        - input: gallery-tauth-signing-key
                          name: GALLERY_TAUTH_SIGNING_KEY
                      id: api
                      image:
                        publication: gallery-service
                      mounts:
                        - target: /data
                          volume: data
                      placement:
                        cardinality: one
                        group: computercat
                      ports:
                        - container_port: 8093
                          host_port: 8093
                          scope: private_lan
                      readiness:
                        endpoint: readiness
                  volumes:
                    - id: data
                      name: tyemirov-site-gallery-data
                      retention: retain
                - id: music
                  services:
                    - command:
                        - --listen
                        - 0.0.0.0:8092
                        - --media-root
                        - /assets/music
                        - --index
                        - /assets/music/catalog.json
                        - --allowlist
                        - /assets/music/allowlist.json
                        - --public-origin
                        - https://api.tyemirov.net
                        - --allowed-origins
                        - https://tyemirov.net,https://www.tyemirov.net
                      endpoints:
                        - endpoint:
                            port: 8092
                            scheme: http
                            scope: private_lan
                          health:
                            expected_status: 200
                            path: /music/readyz
                            protocol: http
                          id: music-http
                          name: tyemirov-site.music-http
                          version: 1
                        - endpoint:
                            alias: music-stream-readiness
                            port: 8092
                            scheme: http
                            scope: same_host
                          health:
                            expected_status: 200
                            path: /music/readyz
                            protocol: http
                          id: readiness
                          name: tyemirov-site.readiness.music.stream
                          version: 1
                      id: stream
                      image:
                        publication: music-service
                      placement:
                        cardinality: one
                        group: computercat
                      ports:
                        - container_port: 8092
                          host_port: 8092
                          scope: private_lan
                      readiness:
                        endpoint: readiness
        github_pages:
            sites:
                - id: website
                  publication: website
                  url: https://tyemirov.net/
        ingress:
            caddy:
                routes:
                    - access: {}
                      handlers:
                        - id: auth
                          path_prefix: /auth
                          upstream: tauth.http
                        - id: gallery
                          path_prefix: /gallery
                          upstream: tyemirov-site.gallery-http
                        - access:
                            browser:
                                allow_credentials: true
                                allowed_origins:
                                    - https://tyemirov.net
                                    - https://www.tyemirov.net
                            rate_limit:
                                events: 6000
                                window_seconds: 60
                          id: music
                          path_prefix: /music
                          upstream: tyemirov-site.music-http
                      hostname: api.tyemirov.net
                      id: api-route
                      listener: https
                      tls:
                        mode: automatic
