---
mprlab_resources:
  owner: tyemirov-site
  ci:
    enabled: true
    command:
      '0': make
      '1': ci
  defaults:
    timeouts:
      startup: 30s
      completion: 30m
      readiness: 2m
      request: 15s
      shutdown: 5s
  operations:
    app-plan-release:
      polling: &lifecycle-polling
        initial: 2s
        maximum: 10s
        increment: 1s
        multiplier: 2
        attempt_limit: 4
    app-plan-publish:
      polling: *lifecycle-polling
    app-plan-deploy:
      polling: *lifecycle-polling
    app-release:
      polling: *lifecycle-polling
    app-publish:
      polling: *lifecycle-polling
    app-deploy:
      polling: *lifecycle-polling
    app_deploy.pages.deployment_status_poll:
      polling:
        initial: 1s
        maximum: 10s
        increment: 0s
        multiplier: 2
        attempt_limit: 120
  release:
    scheme: semver
  resources:
    private:
      kind: private_values
      bindings:
        gallery-tauth-signing-key: GALLERY_TAUTH_SIGNING_KEY
        gallery-google-web-client-id: GALLERY_GOOGLE_WEB_CLIENT_ID
    gallery-auth:
      kind: tauth_tenant
      capability: tauth.tenants
      version: 1
      tenant:
        id: tyemirov-gallery
        display_name: Gallery Studio
        origins:
        - https://tyemirov.net
        google_web_client_id:
          resource: private
          output: gallery-google-web-client-id
        jwt_signing_key:
          resource: private
          output: gallery-tauth-signing-key
        cookie:
          domain: api.tyemirov.net
          session_name: tyemirov_gallery_session
          refresh_name: tyemirov_gallery_refresh
    music:
      kind: compose_project
      images:
        service:
          repository: ghcr.io/tyemirov/personal-site-music
          build:
            context: .
            dockerfile: services/music-stream/Dockerfile
            platforms:
            - linux/amd64
      services:
        stream:
          image: service
          placement:
            group: computercat
            cardinality: one
          command:
            '0': --listen
            '1': 0.0.0.0:8092
            '2': --media-root
            '3': /assets/music
            '4': --index
            '5': /assets/music/catalog.json
            '6': --allowlist
            '7': /assets/music/allowlist.json
            '8': --public-origin
            '9': https://api.tyemirov.net
            '10': --allowed-origins
            '11': https://tyemirov.net,https://www.tyemirov.net
          ports:
            '8092':
              host_port: 8092
              scope: private_lan
          readiness:
            protocol: http
            port: 8092
            path: /music/readyz
            expected_status: 200
    music-http:
      kind: runtime_capability
      name: tyemirov-site.music-http
      version: 1
      project: music
      service: stream
      endpoint:
        scope: private_lan
        scheme: http
        port: 8092
      health:
        protocol: http
        path: /music/readyz
        expected_status: 200
    music-public:
      kind: health_check
      protocol: http
      url: https://api.tyemirov.net/music/readyz
      expected_status: 200
    website:
      kind: github_pages
      repository: tyemirov/tyemirov.github.io
      branch: gh-pages
      domain: tyemirov.net
      url: https://tyemirov.net/
      source:
        kind: container
        context: .
        dockerfile: Dockerfile.pages
      verification:
        path: /.mprlab-release.json
    gallery:
      kind: compose_project
      images:
        service:
          repository: ghcr.io/tyemirov/personal-site-gallery
          build:
            context: .
            dockerfile: services/gallery/Dockerfile
            platforms:
            - linux/amd64
      volumes:
        data:
          name: tyemirov-site-gallery-data
          retention: retain
      services:
        api:
          image: service
          placement:
            group: computercat
            cardinality: one
          command:
            '0': --listen=0.0.0.0:8093
            '1': --database=/data/gallery.db
            '2': --public-root=/site
            '3': --allowed-origin=https://tyemirov.net
            '4': --tenant-id=tyemirov-gallery
            '5': --owner-email=vadym@tyemirov.net
            '6': --cookie-name=tyemirov_gallery_session
            '7': --payments=disabled
            '8': --receipts=disabled
          environment:
            GALLERY_TAUTH_SIGNING_KEY:
              resource: private
              output: gallery-tauth-signing-key
          mounts:
            /data:
              volume: data
          ports:
            '8093':
              host_port: 8093
              scope: private_lan
          readiness:
            protocol: http
            port: 8093
            path: /gallery/readyz
            expected_status: 200
    gallery-http:
      kind: runtime_capability
      name: tyemirov-site.gallery-http
      version: 1
      project: gallery
      service: api
      endpoint:
        scope: private_lan
        scheme: http
        port: 8093
      health:
        protocol: http
        path: /gallery/readyz
        expected_status: 200
    gallery-public:
      kind: health_check
      protocol: http
      url: https://api.tyemirov.net/gallery/readyz
      expected_status: 200
    api-route:
      kind: caddy_route
      hostname: api.tyemirov.net
      listener: https
      handlers:
        music:
          path_prefix: /music
          upstream: tyemirov-site.music-http
          access:
            rate_limit:
              events: 6000
              window_seconds: 60
            browser:
              allowed_origins:
              - https://tyemirov.net
              - https://www.tyemirov.net
              allow_credentials: true
        gallery:
          path_prefix: /gallery
          upstream: tyemirov-site.gallery-http
        auth:
          path_prefix: /auth
          upstream: tauth.http
      tls:
        mode: automatic
      access: {}
