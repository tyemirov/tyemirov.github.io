<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#171411" />
    <title>Vadym Tyemirov | Essays, Tools, and Experiments</title>
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta
      name="description"
      content="Vadym Tyemirov's personal site: essays, research-backed tools, and standalone experiments published directly under tyemirov.net."
    />
    <link rel="canonical" href="https://tyemirov.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vadym Tyemirov" />
    <meta property="og:title" content="Vadym Tyemirov | Essays, Tools, and Experiments" />
    <meta
      property="og:description"
      content="Essays, research-backed tools, and standalone experiments published directly under tyemirov.net."
    />
    <meta property="og:url" content="https://tyemirov.net/" />
    <meta property="og:image" content="https://tyemirov.net/assets/profile/vadym-tyemirov-720.jpg" />
    <meta property="og:image:alt" content="Portrait of Vadym Tyemirov" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vadym Tyemirov | Essays, Tools, and Experiments" />
    <meta
      name="twitter:description"
      content="Essays, research-backed tools, and standalone experiments published directly under tyemirov.net."
    />
    <meta name="twitter:image" content="https://tyemirov.net/assets/profile/vadym-tyemirov-720.jpg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Vadym Tyemirov",
            "url": "https://tyemirov.net/",
            "description": "Essays, research-backed tools, and standalone experiments published directly under tyemirov.net."
          },
          {
            "@type": "Person",
            "name": "Vadym Tyemirov",
            "url": "https://tyemirov.net/",
            "image": "https://tyemirov.net/assets/profile/vadym-tyemirov-720.jpg",
            "jobTitle": "Technical Founder and Engineering Leader",
            "sameAs": ["https://vadymtyemirov1.substack.com", "https://mprlab.com"]
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/MarcoPoloResearchLab/mpr-ui@v3.6.7/mpr-ui.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="site.js" defer></script>
    <script
      defer
      src="https://cdn.jsdelivr.net/gh/MarcoPoloResearchLab/mpr-ui@v3.6.7/mpr-ui.js"
    ></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <p class="eyebrow"></p>
          <h1></h1>
          <p class="lead"></p>
          <p class="lead lead-secondary"></p>
          <div class="hero-links"></div>
        </div>

        <aside class="profile-card" aria-label="Vadym Tyemirov profile">
          <picture class="profile-photo">
            <source
              type="image/webp"
              srcset="assets/profile/vadym-tyemirov-360.webp 360w, assets/profile/vadym-tyemirov-720.webp 720w"
              sizes="(max-width: 640px) 72vw, 360px"
            />
            <img
              src="assets/profile/vadym-tyemirov-360.jpg"
              srcset="assets/profile/vadym-tyemirov-360.jpg 360w, assets/profile/vadym-tyemirov-720.jpg 720w"
              sizes="(max-width: 640px) 72vw, 360px"
              width="360"
              height="540"
              alt="Portrait of Vadym Tyemirov"
              decoding="async"
            />
          </picture>

          <div class="profile-meta">
            <p class="profile-name">Vadym Tyemirov</p>
            <p class="profile-role">Technical Founder &amp; Engineering Leader</p>
            <p class="profile-footnote">Meta · BlackRock · Shopify · Morgan&nbsp;Stanley</p>
          </div>
        </aside>
      </header>

      <main>
        <section class="writing-section is-hidden" aria-label="Writing">
          <div class="section-heading">
            <p class="notes-label">Writing</p>
            <h2 class="section-title">Selected essays from Substack.</h2>
          </div>
          <div class="article-list"></div>
        </section>

        <section class="project-grid" aria-label="Published pages"></section>

        <section class="arts-section is-hidden" aria-label="Arts">
          <div class="section-heading">
            <p class="notes-label">Arts</p>
            <h2 class="section-title">Digital editions and virtual exhibits.</h2>
          </div>
          <div class="arts-list"></div>
        </section>
      </main>
    </div>
    <mpr-footer id="site-footer" class="site-footer"></mpr-footer>
  </body>
</html>
